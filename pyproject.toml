[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-package-registry-api"
version = "0.1.0"
description = "Package registry API for Python and the command line: npm, crates.io and Docker Hub search, PyPI package metadata, Hacker News stories and Stack Overflow questions in one client, with one sign-in and the same JSON or CSV rows for every source. Free and open source; runs on your QuanticData account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["package-registry-api", "package-registry", "npm-registry-api", "npm-registry", "npm", "npm-search", "pypi", "pypi-api", "crates-io", "rust", "docker-hub", "docker-hub-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
package-registry = "quanticdata_package_registry_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/npm-registry-api/?utm_source=github&utm_medium=pypi&utm_campaign=package-registry-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/package-registry-api"
Issues = "https://github.com/quantumproxies/package-registry-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_package_registry_api" = ["spec.json", "py.typed"]
